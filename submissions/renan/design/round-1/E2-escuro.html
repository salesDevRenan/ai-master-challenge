<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2 escuro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/space-grotesk@5.3.0/wght.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/martian-mono@5.3.0/standard.css">
<style>
  /* Linguagem da E (régua de 0 a 138 dias, 4 papéis de cor) + registro da G (código e pares campo/valor em mono). */
  :root {
    --ground: #10283F;
    --primary: #E4ECF3;
    --secondary: #7FA2C2;
    --moment: #5FD4C4;
    --stalled: #F2C14E;
  }
  html { background: var(--ground); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Space Grotesk Variable", system-ui, sans-serif;
    color: var(--primary);
    padding: 7vh 5vw 8vh 5vw;
    box-sizing: border-box;
    --axis: calc(100vw - 10vw - 30ch);
  }
  p { margin: 0; }
  .mono { font-family: "Martian Mono Variable", ui-monospace, monospace; }
  .day { padding-left: calc(var(--axis) * var(--d) / 138); }
  .field { font-family: "Martian Mono Variable", ui-monospace, monospace; font-stretch: 75%; font-size: 12px; font-weight: 450; letter-spacing: 0.14em; text-transform: uppercase; color: var(--secondary); }
  .top { display: flex; justify-content: space-between; gap: 2em; }
  .ask { font-size: clamp(30px, 4vw, 64px); font-weight: 600; letter-spacing: -0.03em; margin-top: 7vh; }
  .deal { margin-top: 6vh; }
  .id { font-family: "Martian Mono Variable", ui-monospace, monospace; font-stretch: 112.5%; font-weight: 250; font-size: clamp(18px, 1.8vw, 28px); letter-spacing: 0.04em; color: var(--secondary); }
  .big { font-size: clamp(44px, 7vw, 120px); font-weight: 700; letter-spacing: -0.045em; line-height: 0.9; margin-top: 0.15em; }
  .rec { display: grid; grid-template-columns: max-content 1fr; column-gap: 3ch; row-gap: 0.55em; align-items: baseline; margin-top: 1.4em; font-size: clamp(16px, 1.3vw, 22px); }
  .rec .v { font-weight: 500; font-variant-numeric: tabular-nums; }
  .rec .now { color: var(--moment); font-weight: 650; }
  .act { color: var(--moment); font-size: clamp(16px, 1.3vw, 22px); font-weight: 450; margin-top: 3.5vh; max-width: 36ch; }
  .dead { color: var(--stalled); margin-top: 9vh; font-size: clamp(20px, 2vw, 34px); font-weight: 650; letter-spacing: -0.02em; text-align: right; }
  .dead + .field { text-align: right; margin-top: 0.6em; color: var(--stalled); }
</style>
</head>
<body>
<main>
  <div class="top"><p class="field">Segunda-feira</p><p class="field">Pipeline em 31/12/2017</p></div>
  <p class="ask">Onde focar hoje</p>

  <div class="deal day" style="--d: 95">
    <p class="id">1LY8CAXD</p>
    <p class="big">GTK&nbsp;500</p>
    <div class="rec">
      <p class="field">Rosalina Dieter</p><p class="v">Chance 71%</p>
      <p class="field">Valor esperado</p><p class="v">US$&nbsp;18.948</p>
      <p class="field">Aberto há 95&nbsp;dias.</p><p class="v now">Reta final.</p>
    </div>
  </div>

  <p class="act day" style="--d: 88">Empurrar o fechamento: 75% dos ganhos fecham até o 88º&nbsp;dia.</p>

  <p class="dead">1.291 deals parados há mais de 138&nbsp;dias</p>
  <p class="field">64% do valor do pipeline aberto</p>
</main>
</body>
</html>
